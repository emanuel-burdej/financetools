<style>
:root {
  --bg: #fafbfc;
  --surface: #ffffff;
  --elevated: #ffffff;
  --ink: #111827;
  --muted: #6b7280;
  --faint: #9ca3af;
  --line: #e5e7eb;
  --line-2: #f3f4f6;
  --accent: #6366f1;
  --accent-soft: rgba(99, 102, 241, 0.12);
  --green: #16a34a;
  --target: #f59e0b;
  --portfolio: #6366f1;
  --contrib: #8bbc21;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --focus: 0 0 0 3px rgba(99, 102, 241, 0.28);
  --nav-bg: rgba(255,255,255,.92);
  --th-bg: #f9fafb;
  --chart-grid: #e5e7eb;
  --chart-axis: #9ca3af;
  --field-bg: #ffffff;
  --field-border: #d1d5db;
  --slider: #6366f1;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1b1e;
  --surface: #24262b;
  --elevated: #32353c;
  --ink: #f5f6f7;
  --muted: #9aa0a6;
  --faint: #7a8088;
  --line: #34373e;
  --line-2: #2c2e34;
  --accent: #818cf8;
  --accent-soft: rgba(129, 140, 248, 0.16);
  --green: #16a34a;
  --target: #fbbf24;
  --portfolio: #818cf8;
  --contrib: #8bbc21;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
  --focus: 0 0 0 3px rgba(129, 140, 248, 0.35);
  --nav-bg: rgba(26, 27, 30, .92);
  --th-bg: #2a2c32;
  --chart-grid: #34373e;
  --chart-axis: #c5cad3;
  --field-bg: #2c2e34;
  --field-border: #3f434c;
  --slider: #818cf8;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  font-family: var(--sans); color: var(--ink);
  background: var(--bg); line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); }

.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topnav {
  position: sticky; top: 0; z-index: 100;
  background: var(--nav-bg);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topnav-inner {
  max-width: 1180px; margin: 0 auto;
  padding: 0 24px;
  display: flex; align-items: center; gap: 20px;
  min-height: 56px;
}
.app-dd { position: relative; flex-shrink: 0; }
.app-dd-btn {
  appearance: none; border: 0; background: transparent;
  font: inherit; font-weight: 700; font-size: .95rem; letter-spacing: -.02em;
  color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 8px; border-radius: 8px; white-space: nowrap;
}
.app-dd-btn:hover { background: var(--line-2); }
.app-dd-btn .accent { color: var(--accent); }
.app-dd-btn .chev {
  width: 0; height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--muted);
  margin-top: 2px;
}
.app-dd.open .app-dd-btn .chev { transform: rotate(180deg); }
.app-dd-menu {
  display: none;
  position: absolute; top: calc(100% + 12px); left: 0; z-index: 110;
  min-width: 200px;
  background: var(--elevated);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 14px 36px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  padding: 6px;
}
.app-dd.open .app-dd-menu { display: block; }
.app-dd-menu a {
  display: block;
  color: var(--ink); text-decoration: none;
  font-size: .8125rem; font-weight: 600;
  padding: 9px 12px; border-radius: 8px; white-space: nowrap;
}
.app-dd-menu a:hover { background: var(--line-2); }
.app-link-tracker span { color: #e30613; }
.app-link-calc span { color: #16a34a; }
.app-link-retire span { color: #6366f1; }
.nav-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pref-toggles { display: inline-flex; align-items: center; gap: 6px; }
.pref-btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); border-radius: 8px; padding: 6px 10px;
  cursor: pointer; font-weight: 700; font-size: .75rem;
  letter-spacing: .03em; line-height: 1; min-width: 40px;
}
.pref-btn:hover { color: var(--ink); background: var(--line-2); border-color: var(--muted); }
.pref-btn.theme-btn {
  min-width: 40px; font-size: 1rem; padding: 6px 10px;
  color: var(--ink); border-color: var(--line); background: var(--line-2);
}
.pref-btn.theme-btn:hover { border-color: var(--ink); background: var(--surface); }

.app { max-width: 1180px; margin: 0 auto; padding: 24px 24px 64px; width: 100%; }

.layout {
  display: grid;
  grid-template-columns: minmax(320px, 380px) minmax(0, 1fr);
  gap: 16px;
  align-items: stretch;
}
.layout .panel-schedule {
  grid-column: 1 / -1;
}
.layout > .panel-chart {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  overflow: visible;
}
.layout > .panel-chart > .panel-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
  overflow: visible;
}

.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden;
  min-width: 0;
}
.section-head {
  background: var(--line-2); color: var(--ink);
  padding: 10px 16px; font-weight: 700; font-size: .875rem;
  line-height: 1.2;
  border-bottom: 1px solid var(--line);
}
.panel-body { padding: 14px; }

.results-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 12px 28px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

.kpi-row {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  min-width: 0;
  text-align: left;
}
.kpi-row span {
  color: var(--muted);
  font-size: .6875rem;
  font-weight: 650;
  line-height: 1.2;
}
.kpi-row strong {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: .875rem;
  line-height: 1.25;
  color: var(--ink);
}
#retireHeroRow strong { color: var(--accent); }
#kpiTarget { color: var(--target); }
.kpi-row.ready strong { color: var(--green); }
.kpi-row.never strong { color: var(--faint); }
.kpi-row .kpi-pct {
  color: var(--muted);
  font-weight: 600;
  font-size: .6875rem;
}

.kpi-tip-wrap {
  position: relative;
  cursor: help;
}
.kpi-tip-wrap .kpi-label {
  border-bottom: 1px dashed var(--muted);
  width: fit-content;
}
.kpi-tip {
  display: none;
  position: absolute;
  left: 0;
  top: calc(100% + 8px);
  z-index: 30;
  width: 260px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--elevated);
  border: 1px solid var(--line);
  box-shadow: 0 10px 28px rgba(0,0,0,.45);
  color: var(--ink);
  font-size: .6875rem;
  font-weight: 500;
  line-height: 1.4;
  pointer-events: none;
}
.kpi-tip-wrap:hover .kpi-tip,
.kpi-tip-wrap:focus-within .kpi-tip {
  display: block;
}

.field {
  display: grid;
  gap: 6px;
  margin-bottom: 14px;
}
.field:last-of-type { margin-bottom: 0; }
.field-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 120px;
  align-items: center;
  gap: 10px;
}
.field-top label {
  font-size: .75rem;
  font-weight: 650;
  color: var(--muted);
}
.control {
  display: flex;
  align-items: center;
  width: 120px;
  height: 30px;
  padding: 0 8px;
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  border-radius: 6px;
}
.control:focus-within { box-shadow: var(--focus); }
.prefix, .suffix {
  flex-shrink: 0;
  font-size: .75rem;
  font-weight: 500;
  color: var(--muted);
}
.prefix { margin-right: 3px; }
.suffix { margin-left: 4px; }
.input {
  flex: 1;
  min-width: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
  color: var(--ink);
  padding: 0;
  font-size: .8125rem;
  font-weight: 600;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.input:focus { outline: none; }
.input::-webkit-outer-spin-button,
.input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.input[type=number] { -moz-appearance: textfield; appearance: textfield; }

.slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 99px;
  background: var(--line);
  outline: none;
  cursor: pointer;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--slider);
  border: 2px solid #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  cursor: pointer;
}
.slider::-moz-range-thumb {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--slider);
  border: 2px solid #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  cursor: pointer;
}

.form-note {
  margin: 0;
  font-size: .75rem;
  color: var(--muted);
  line-height: 1.4;
}

.table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
}
table { width: 100%; border-collapse: collapse; font-size: .8125rem; }
th, td {
  padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line);
}
th {
  position: sticky; top: 0;
  background: var(--th-bg); color: var(--muted);
  font-weight: 700; font-size: .75rem; text-transform: uppercase;
  letter-spacing: .03em;
}
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
tbody tr:nth-child(even) td { background: var(--line-2); }
tr.retire-row td {
  background: var(--accent-soft) !important;
  font-weight: 650;
}
.progress-cell {
  display: flex; align-items: center; justify-content: flex-end; gap: 6px;
}
.progress-bar {
  width: 44px; height: 3px; border-radius: 99px;
  background: var(--line); overflow: hidden;
}
.progress-bar > span {
  display: block; height: 100%; background: var(--accent); border-radius: 99px;
}

.chart-box {
  position: relative;
  width: 100%;
  flex: 1;
  min-width: 0;
  overflow: visible;
}
.chart-box canvas {
  display: block;
  width: 100%;
  height: 280px;
}
.chart-tip {
  position: absolute;
  z-index: 5;
  min-width: 160px;
  padding: 7px 9px;
  border-radius: 6px;
  background: #2a2c32;
  color: #f5f6f7;
  border: 1px solid var(--line);
  font-size: .72rem;
  line-height: 1.35;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
  display: none;
  transform: translate(-50%, -110%);
}
.chart-tip.visible { display: block; }
.chart-legend {
  display: flex; flex-wrap: wrap; gap: 10px 16px;
  margin-top: 4px; font-size: .75rem; color: var(--muted);
  justify-content: center;
  align-items: center;
}
.chart-legend i {
  display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px;
}
.chart-legend .dot-contrib {
  display: inline-block; width: 8px; height: 8px; border-radius: 2px;
  background: var(--contrib, #8bbc21); margin-right: 5px;
}
.chart-legend .line {
  display: inline-block; width: 12px; height: 0;
  border-top: 2px dashed var(--target); margin-right: 5px; vertical-align: middle;
}
.chart-legend .legend-target {
  display: inline-flex;
  align-items: center;
  cursor: help;
}
.chart-legend .legend-target .kpi-tip {
  left: 50%;
  top: auto;
  bottom: calc(100% + 8px);
  transform: translateX(-50%);
  width: 260px;
}

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .topnav-inner, .app { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="topnav">
    <div class="topnav-inner">
      <div class="app-dd" id="appDd">
        <button type="button" class="app-dd-btn" id="appDdBtn" aria-haspopup="listbox" aria-expanded="false">
          Retire <span class="accent">Calculator</span>
          <i class="chev" aria-hidden="true"></i>
        </button>
        <div class="app-dd-menu" role="listbox">
          <a href="xtbTracker.html" class="app-link-tracker">XTB <span>Tracker</span></a>
          <a href="investmentCalculator.html" class="app-link-calc">Invest <span>Calculator</span></a>
        </div>
      </div>
      <div class="nav-actions">
        <div class="pref-toggles" aria-label="Preferences">
          <button type="button" class="pref-btn" id="langToggle" title="Language">SK</button>
          <button type="button" class="pref-btn theme-btn" id="themeToggle" title="Dark mode" aria-label="Theme">☾</button>
        </div>
      </div>
    </div>
  </header>

  <main class="app">
    <div class="layout">
      <section class="panel">
        <div class="section-head" data-i18n="inputs">Vstupy</div>
        <div class="panel-body">
          <div class="field">
            <div class="field-top">
              <label for="portfolio" data-i18n="portfolio">Súčasná hodnota portfólia</label>
              <div class="control">
                <input class="input" id="portfolio" type="number" min="0" step="1000" value="50000" />
                <span class="suffix">€</span>
              </div>
            </div>
            <input class="slider" id="portfolioSlider" type="range" min="0" max="500000" step="1000" value="50000" />
          </div>

          <div class="field">
            <div class="field-top">
              <label for="monthlyInvest" data-i18n="monthlyInvest">Mesačný vklad</label>
              <div class="control">
                <input class="input" id="monthlyInvest" type="number" min="0" step="50" value="200" />
                <span class="suffix">€</span>
              </div>
            </div>
            <input class="slider" id="monthlyInvestSlider" type="range" min="0" max="5000" step="50" value="200" />
          </div>

          <div class="field">
            <div class="field-top">
              <label for="returnRate" data-i18n="returnRate">Očakávaný výnos</label>
              <div class="control">
                <input class="input" id="returnRate" type="number" min="0" max="20" step="0.1" value="5" />
                <span class="suffix">%</span>
              </div>
            </div>
            <input class="slider" id="returnRateSlider" type="range" min="0" max="15" step="0.1" value="5" />
          </div>

          <div class="field">
            <div class="field-top">
              <label for="monthlyWithdraw" data-i18n="monthlyWithdraw">Mesačný výber</label>
              <div class="control">
                <input class="input" id="monthlyWithdraw" type="number" min="0" step="50" value="750" />
                <span class="suffix">€</span>
              </div>
            </div>
            <input class="slider" id="monthlyWithdrawSlider" type="range" min="0" max="10000" step="50" value="750" />
          </div>
        </div>
      </section>

      <section class="panel panel-chart">
        <div class="section-head" data-i18n="chartTitle">Cesta k dôchodku</div>
        <div class="panel-body">
          <div class="results-bar">
            <div class="kpi-row" id="retireHeroRow">
              <span id="retireLabel" data-i18n="youCanRetire">Do dôchodku môžeš ísť o</span>
              <strong id="retireYears">—</strong>
            </div>
            <div class="kpi-row">
              <span data-i18n="targetPortfolio">Cieľové portfólio</span>
              <strong id="kpiTarget">—</strong>
            </div>
            <div class="kpi-row">
              <span data-i18n="gap">Do cieľa chýba</span>
              <strong id="kpiGap">—</strong>
            </div>
          </div>
          <div class="chart-box">
            <canvas id="pathChart" aria-label="Retirement path chart"></canvas>
            <div id="chartTip" class="chart-tip" hidden></div>
          </div>
          <div class="chart-legend">
            <span><i style="background:var(--portfolio)"></i><span data-i18n="legendPortfolio">Portfólio</span></span>
            <span><i class="dot-contrib"></i><span data-i18n="legendContrib">Vklady</span></span>
            <span class="legend-target kpi-tip-wrap" tabindex="0">
              <span class="line"></span><span class="kpi-label" data-i18n="legendTarget">Cieľ (pravidlo 4 %)</span>
              <div class="kpi-tip" id="legendHint"></div>
            </span>
          </div>
        </div>
      </section>

      <section class="panel panel-schedule">
        <div class="section-head" data-i18n="schedule">Harmonogram</div>
        <div class="panel-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="colYear">Rok</th>
                  <th class="num" data-i18n="colDeposit">Vklady</th>
                  <th class="num" data-i18n="colGrowth">Výnos</th>
                  <th class="num" data-i18n="colBalance">Zostatok</th>
                  <th class="num" data-i18n="colProgress">Pokrok</th>
                </tr>
              </thead>
              <tbody id="schedBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

    youCanRetireNow: 'You can retire',
    yearsUnit: '{n} years',
    yearUnit: '{n} year',
    yearsUnitFew: '{n} years',
    yearsUnitFrac: '{n} years',
    canRetireNow: 'now',
    neverRetire: 'With these inputs you will never reach the target',
    hintTarget: '4% rule: to withdraw {monthly} per month, you need to save {target} (annual withdrawal × 25).',
    targetPortfolio: 'Target portfolio',
    gap: 'Remaining to target',
    progressNow: 'Current progress',
    totalContrib: 'Total contributions until retirement',
    retireBalance: 'Portfolio at retirement',
    legendPortfolio: 'Portfolio',
    legendContrib: 'Contributions',
    legendTarget: 'Target (4% rule)',
    colYear: 'Year', colDeposit: 'Contributions', colGrowth: 'Return', colBalance: 'Balance', colProgress: 'Progress',
    tipYear: 'Year {n}', tipPortfolio: 'Portfolio', tipContrib: 'Contributions', tipTarget: 'Target',
    chartTarget: 'Target {amount}',
    growthShare: 'growth',
    themeToDark: 'Dark mode', themeToLight: 'Light mode',
  },
};

const prefs = {
  lang: localStorage.getItem('xtb-lang') || 'sk',
  theme: localStorage.getItem('xtb-theme') || 'dark',
};

let state = { result: null };

function t(key, vars) {
  let s = (I18N[prefs.lang] || I18N.sk)[key] ?? I18N.sk[key] ?? key;
  if (vars) {
    for (const [k, v] of Object.entries(vars)) s = s.replace('{' + k + '}', String(v));
  }
  return s;
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', prefs.theme);
  const meta = document.querySelector('meta[name="color-scheme"]');
  if (meta) meta.content = prefs.theme === 'dark' ? 'dark' : 'light';
}

function applyI18n() {
  document.documentElement.lang = prefs.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  const langBtn = document.getElementById('langToggle');
  if (langBtn) {
    langBtn.textContent = prefs.lang === 'en' ? 'EN' : 'SK';
    langBtn.title = prefs.lang === 'en' ? 'English → SK' : 'Slovenčina → EN';
  }
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    const dark = prefs.theme === 'dark';
    themeBtn.textContent = dark ? '☀' : '☾';
    themeBtn.title = dark ? t('themeToLight') : t('themeToDark');
    themeBtn.setAttribute('aria-label', themeBtn.title);
  }
  if (state.result) renderAll(state.result);
}

function setLang(lang) {
  prefs.lang = lang === 'en' ? 'en' : 'sk';
  localStorage.setItem('xtb-lang', prefs.lang);
  applyI18n();
}

function setTheme(theme) {
  prefs.theme = theme === 'dark' ? 'dark' : 'light';
  localStorage.setItem('xtb-theme', prefs.theme);
  applyTheme();
  applyI18n();
}

function bindAppDropdown() {
  const dd = document.getElementById('appDd');
  const btn = document.getElementById('appDdBtn');
  if (!dd || !btn) return;
  const close = () => {
    dd.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  };
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = !dd.classList.contains('open');
    dd.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', close);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
  });
}

const APP_PAGE_RE = /(?:^|\/)(index|xtbTracker|investmentCalculator|retireCalculator)\.html(?:$|\?|#)/;

function stripCacheBustFromAddress() {
  const url = new URL(location.href);
  if (!url.searchParams.has('v')) return;
  url.searchParams.delete('v');
  const q = url.searchParams.toString();
  history.replaceState(null, '', url.pathname + (q ? `?${q}` : '') + url.hash);
}

function bindCacheBustLinks() {
  document.querySelectorAll('a[href]').forEach((a) => {
    const raw = a.getAttribute('href');
    if (!raw || !APP_PAGE_RE.test(raw)) return;
    a.addEventListener('click', () => {
      const base = (a.getAttribute('href') || raw).split('?')[0].split('#')[0];
      a.setAttribute('href', `${base}?v=${Date.now()}`);
    });
  });
}

function money(n) {
  return new Intl.NumberFormat(prefs.lang === 'en' ? 'en-US' : 'sk-SK', {
    style: 'currency', currency: 'EUR', maximumFractionDigits: 0,
  }).format(n || 0);
}

function formatYears(years) {
  const n = Math.round(years * 10) / 10;
  const text = prefs.lang === 'sk'
    ? String(n).replace('.', ',')
    : String(n);
  const whole = Math.abs(n - Math.round(n)) < 1e-9;
  if (prefs.lang === 'sk') {
    if (!whole) return t('yearsUnitFrac', { n: text });
    const i = Math.round(n);
    if (i === 1) return t('yearUnit', { n: text });
    if (i >= 2 && i <= 4) return t('yearsUnitFew', { n: text });
    return t('yearsUnit', { n: text });
  }
  return n === 1 ? t('yearUnit', { n: text }) : t('yearsUnit', { n: text });
}

function cssVar(name, fallback) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
}

function readInputs() {
  return {
    portfolio: Math.max(0, Number(document.getElementById('portfolio').value) || 0),
    monthlyInvest: Math.max(0, Number(document.getElementById('monthlyInvest').value) || 0),
    annualRate: Math.max(0, (Number(document.getElementById('returnRate').value) || 0) / 100),
    monthlyWithdraw: Math.max(0, Number(document.getElementById('monthlyWithdraw').value) || 0),
  };
}

/** Months until portfolio reaches target with growth + monthly deposits. */
function monthsToTarget(pv, pmt, monthlyRate, target) {
  if (target <= 0) return 0;
  if (pv >= target) return 0;
  if (monthlyRate <= 0) {
    if (pmt <= 0) return Infinity;
    return (target - pv) / pmt;
  }
  const denom = pv + pmt / monthlyRate;
  if (denom <= 0) return Infinity;
  const x = (target + pmt / monthlyRate) / denom;
  if (x <= 1) return 0;
  return Math.log(x) / Math.log(1 + monthlyRate);
}

function buildSchedule(pv, pmt, monthlyRate, months, target) {
  const years = Math.max(1, Math.ceil(months / 12));
  const chartYears = Math.min(80, Math.max(years + 2, 10));
  const annual = [];
  const points = [{ year: 0, balance: pv, contrib: pv }];
  let balance = pv;
  let contribCum = pv;

  annual.push({
    year: 0,
    deposit: 0,
    growth: 0,
    balance: pv,
    progress: target > 0 ? Math.min(100, (pv / target) * 100) : 100,
  });

  for (let y = 1; y <= chartYears; y++) {
    let deposit = 0;
    let growth = 0;
    for (let m = 0; m < 12; m++) {
      const before = balance;
      balance *= (1 + monthlyRate);
      growth += balance - before;
      if (pmt > 0) {
        balance += pmt;
        deposit += pmt;
        contribCum += pmt;
      }
    }
    const progress = target > 0 ? Math.min(100, (balance / target) * 100) : 100;
    annual.push({ year: y, deposit, growth, balance, progress });
    points.push({ year: y, balance, contrib: contribCum });
  }

  const retireMonths = monthsToTarget(pv, pmt, monthlyRate, target);
  let retireBalance = pv;
  let contribUntil = 0;
  if (Number.isFinite(retireMonths)) {
    const full = Math.floor(retireMonths);
    for (let m = 0; m < full; m++) {
      retireBalance = retireBalance * (1 + monthlyRate) + pmt;
      contribUntil += pmt;
    }
    const frac = retireMonths - full;
    if (frac > 0) {
      retireBalance = retireBalance * (1 + monthlyRate * frac) + pmt * frac;
      contribUntil += pmt * frac;
    }
  }

  return { annual, points, totalContrib: contribUntil, retireBalance, chartYears };
}

function calculate() {
  const { portfolio, monthlyInvest, annualRate, monthlyWithdraw } = readInputs();
  const annualWithdraw = monthlyWithdraw * 12;
  const target = annualWithdraw > 0 ? annualWithdraw / SAFE_WITHDRAWAL_RATE : 0;
  const monthlyRate = annualRate / 12;
  const months = monthsToTarget(portfolio, monthlyInvest, monthlyRate, target);
  const years = Number.isFinite(months) ? months / 12 : Infinity;
  const sched = buildSchedule(
    portfolio,
    monthlyInvest,
    monthlyRate,
    Number.isFinite(months) ? months : 40 * 12,
    target,
  );

  return {
    portfolio,
    monthlyInvest,
    annualRate,
    monthlyWithdraw,
    annualWithdraw,
    withdrawRate: SAFE_WITHDRAWAL_RATE,
    target,
    months,
    years,
    gap: Math.max(0, target - portfolio),
    ...sched,
  };
}

function renderHero(r) {
  const yearsEl = document.getElementById('retireYears');
  const labelEl = document.getElementById('retireLabel');
  const row = document.getElementById('retireHeroRow');
  const legendHint = document.getElementById('legendHint');
  row.classList.remove('ready', 'never');

  if (r.target <= 0) {
    labelEl.textContent = '';
    yearsEl.textContent = '—';
    if (legendHint) legendHint.textContent = '';
    return;
  }

  if (r.years === 0) {
    labelEl.textContent = t('youCanRetireNow');
    yearsEl.textContent = t('canRetireNow');
    row.classList.add('ready');
  } else if (!Number.isFinite(r.years)) {
    labelEl.textContent = '';
    yearsEl.textContent = t('neverRetire');
    row.classList.add('never');
  } else {
    labelEl.textContent = t('youCanRetire');
    yearsEl.textContent = formatYears(r.years);
  }
  if (legendHint) {
    legendHint.textContent = t('hintTarget', {
      monthly: money(r.monthlyWithdraw),
      target: money(r.target),
    });
  }
}

function formatPct(n) {
  if (!Number.isFinite(n)) return '—';
  const v = Math.round(n * 10) / 10;
  const text = prefs.lang === 'sk' ? String(v).replace('.', ',') : String(v);
  return `${text} %`;
}

function moneyWithPct(amount, pct) {
  if (amount == null || !Number.isFinite(amount)) return '—';
  if (pct == null || !Number.isFinite(pct)) return money(amount);
  return `${money(amount)} <span class="kpi-pct">(${formatPct(pct)})</span>`;
}

function renderKpis(r) {
  const gapPct = r.target > 0 ? (r.gap / r.target) * 100 : 0;
  document.getElementById('kpiTarget').textContent = r.target > 0 ? money(r.target) : '—';
  document.getElementById('kpiGap').innerHTML = r.target > 0 ? moneyWithPct(r.gap, gapPct) : '—';
}

function renderTable(r) {
  const body = document.getElementById('schedBody');
  if (r.target <= 0) {
    body.innerHTML = '';
    return;
  }
  const retireYear = Number.isFinite(r.years)
    ? (r.years === 0 ? 0 : Math.ceil(r.years))
    : null;
  const rows = r.annual.filter(row => retireYear == null || row.year <= retireYear);
  body.innerHTML = rows.map(row => {
    const isRetire = retireYear != null && row.year === retireYear;
    const pct = Math.round(row.progress);
    return `<tr class="${isRetire ? 'retire-row' : ''}">
      <td>${row.year}</td>
      <td class="num">${money(row.deposit)}</td>
      <td class="num">${money(row.growth)}</td>
      <td class="num">${money(row.balance)}</td>
      <td class="num"><div class="progress-cell"><span>${pct}%</span><span class="progress-bar"><span style="width:${pct}%"></span></span></div></td>
    </tr>`;
  }).join('');
}

const chartState = {
  points: [], target: 0, pad: null, bound: false,
  hoverYear: null, result: null, xAt: null, yAt: null, maxX: 1, maxY: 1,
};

function niceSliderMax(value, step, fallbackMax) {
  const s = step || 1;
  const v = Math.max(0, value);
  if (v <= fallbackMax) return fallbackMax;
  const padded = v * 1.25;
  return Math.ceil(padded / s) * s;
}

function drawChart(r, hoverYear = chartState.hoverYear) {
  const canvas = document.getElementById('pathChart');
  const box = canvas.parentElement;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  // Measure parent — canvas width attr (540) otherwise locks layout width
  const cssW = Math.max(320, Math.floor(box.getBoundingClientRect().width));
  const cssH = 280;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  chartState.result = r;
  if (!r || !r.points.length || r.target <= 0) return;

  const maxY = Math.max(
    r.target * 1.08,
    ...r.points.map(p => Math.max(p.balance, p.contrib || 0)),
    1,
  ) * 1.05;
  const maxX = Math.max(1, r.points[r.points.length - 1].year);

  ctx.font = '11px ' + cssVar('--sans', 'sans-serif');
  let labelW = 0;
  for (let i = 0; i <= 4; i++) {
    const label = money((maxY / 4) * i).replace(/\s/g, '\u00a0');
    labelW = Math.max(labelW, ctx.measureText(label).width);
  }
  const pad = {
    l: Math.ceil(labelW) + 14,
    r: 16,
    t: 22,
    b: 36,
  };

  chartState.pad = pad;
  chartState.points = r.points;
  chartState.target = r.target;
  chartState.w = cssW;
  chartState.h = cssH;
  chartState.maxX = maxX;
  chartState.maxY = maxY;

  const xAt = (year) => pad.l + (year / maxX) * (cssW - pad.l - pad.r);
  const yAt = (val) => pad.t + (1 - val / maxY) * (cssH - pad.t - pad.b);
  chartState.xAt = xAt;
  chartState.yAt = yAt;

  ctx.strokeStyle = cssVar('--chart-grid', '#34373e');
  ctx.lineWidth = 1;
  ctx.fillStyle = cssVar('--chart-axis', '#9aa0a6');
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const v = (maxY / 4) * i;
    const y = yAt(v);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(cssW - pad.r, y);
    ctx.stroke();
    ctx.fillText(money(v).replace(/\s/g, '\u00a0'), pad.l - 8, y);
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const xTicks = Math.min(8, maxX);
  for (let i = 0; i <= xTicks; i++) {
    const year = Math.round((maxX / xTicks) * i);
    ctx.fillText(String(year), xAt(year), cssH - pad.b + 10);
  }

  // contributions line
  ctx.beginPath();
  ctx.moveTo(xAt(0), yAt(r.points[0].contrib));
  for (const p of r.points) ctx.lineTo(xAt(p.year), yAt(p.contrib));
  ctx.strokeStyle = cssVar('--contrib', '#8bbc21');
  ctx.lineWidth = 2;
  ctx.stroke();

  // target line
  const ty = yAt(r.target);
  ctx.setLineDash([6, 5]);
  ctx.strokeStyle = cssVar('--target', '#f59e0b');
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(pad.l, ty);
  ctx.lineTo(cssW - pad.r, ty);
  ctx.stroke();
  ctx.setLineDash([]);

  // portfolio area
  const grad = ctx.createLinearGradient(0, pad.t, 0, cssH - pad.b);
  grad.addColorStop(0, 'rgba(99,102,241,0.28)');
  grad.addColorStop(1, 'rgba(99,102,241,0.02)');
  ctx.beginPath();
  ctx.moveTo(xAt(0), yAt(r.points[0].balance));
  for (const p of r.points) ctx.lineTo(xAt(p.year), yAt(p.balance));
  ctx.lineTo(xAt(maxX), cssH - pad.b);
  ctx.lineTo(xAt(0), cssH - pad.b);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // portfolio line
  ctx.beginPath();
  ctx.moveTo(xAt(0), yAt(r.points[0].balance));
  for (const p of r.points) ctx.lineTo(xAt(p.year), yAt(p.balance));
  ctx.strokeStyle = cssVar('--portfolio', '#6366f1');
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // points
  const activeYear = hoverYear != null ? hoverYear : null;
  for (const p of r.points) {
    const active = activeYear != null && p.year === activeYear;
    ctx.beginPath();
    ctx.arc(xAt(p.year), yAt(p.balance), active ? 6 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = cssVar('--portfolio', '#6366f1');
    ctx.fill();
    ctx.lineWidth = active ? 2 : 1.5;
    ctx.strokeStyle = active ? '#fff' : cssVar('--surface', '#24262b');
    ctx.stroke();

    if (active) {
      // also highlight contrib point
      ctx.beginPath();
      ctx.arc(xAt(p.year), yAt(p.contrib), 5, 0, Math.PI * 2);
      ctx.fillStyle = cssVar('--contrib', '#8bbc21');
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();

      // vertical guide
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = cssVar('--muted', '#9aa0a6');
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(xAt(p.year), pad.t);
      ctx.lineTo(xAt(p.year), cssH - pad.b);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // retirement marker (only if not same as hover or always show slightly)
  if (Number.isFinite(r.years) && r.years > 0) {
    const ryYear = Math.min(r.years, maxX);
    if (activeYear == null || Math.round(ryYear) !== activeYear) {
      const rx = xAt(ryYear);
      const ry = yAt(r.retireBalance);
      ctx.beginPath();
      ctx.arc(rx, ry, 5, 0, Math.PI * 2);
      ctx.fillStyle = cssVar('--accent', '#6366f1');
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    }
  }
}

function bindChartTip() {
  if (chartState.bound) return;
  chartState.bound = true;
  const canvas = document.getElementById('pathChart');
  const tip = document.getElementById('chartTip');

  const clearHover = () => {
    tip.classList.remove('visible');
    tip.hidden = true;
    if (chartState.hoverYear != null) {
      chartState.hoverYear = null;
      if (chartState.result) drawChart(chartState.result, null);
    }
  };

  canvas.addEventListener('mousemove', (e) => {
    if (!chartState.points.length) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const { pad, maxX, points, target, w } = chartState;
    if (x < pad.l || x > w - pad.r) {
      clearHover();
      return;
    }
    const year = Math.round(((x - pad.l) / (w - pad.l - pad.r)) * maxX);
    const p = points.find(pt => pt.year === year) || points[points.length - 1];
    if (chartState.hoverYear !== p.year) {
      chartState.hoverYear = p.year;
      drawChart(chartState.result, p.year);
    }
    tip.innerHTML = `<strong>${t('tipYear', { n: p.year })}</strong><br>${t('tipPortfolio')}: ${money(p.balance)}<br>${t('tipContrib')}: ${money(p.contrib)}<br>${t('tipTarget')}: ${money(target)}`;
    tip.style.left = `${e.clientX - rect.left}px`;
    tip.style.top = `${e.clientY - rect.top}px`;
    tip.hidden = false;
    tip.classList.add('visible');
  });
  canvas.addEventListener('mouseleave', clearHover);
}

function renderAll(r) {
  state.result = r;
  renderHero(r);
  renderKpis(r);
  renderTable(r);
  drawChart(r);
  bindChartTip();
}

function recompute() {
  renderAll(calculate());
}

function bindField(inputId, sliderId, opts = {}) {
  const input = document.getElementById(inputId);
  const slider = document.getElementById(sliderId);
  const baseMax = Number(slider.max);
  const syncFromInput = () => {
    let v = Number(input.value);
    if (!Number.isFinite(v)) v = 0;
    if (opts.min != null) v = Math.max(opts.min, v);
    const nextMax = niceSliderMax(v, opts.step || Number(slider.step) || 1, baseMax);
    slider.max = String(nextMax);
    input.value = String(v);
    slider.value = String(Math.min(nextMax, Math.max(Number(slider.min), v)));
    recompute();
  };
  const syncFromSlider = () => {
    input.value = slider.value;
    recompute();
  };
  input.addEventListener('input', syncFromInput);
  input.addEventListener('change', syncFromInput);
  slider.addEventListener('input', syncFromSlider);
}

applyTheme();
applyI18n();
bindAppDropdown();
stripCacheBustFromAddress();
bindCacheBustLinks();
bindField('portfolio', 'portfolioSlider', { min: 0, step: 1000 });
bindField('monthlyInvest', 'monthlyInvestSlider', { min: 0, step: 50 });
bindField('returnRate', 'returnRateSlider', { min: 0, step: 0.1 });
bindField('monthlyWithdraw', 'monthlyWithdrawSlider', { min: 0, step: 50 });

document.getElementById('langToggle')?.addEventListener('click', () => {
  setLang(prefs.lang === 'sk' ? 'en' : 'sk');
});
document.getElementById('themeToggle')?.addEventListener('click', () => {
  setTheme(prefs.theme === 'dark' ? 'light' : 'dark');
});
window.addEventListener('resize', () => {
  if (state.result) drawChart(state.result, chartState.hoverYear);
});

requestAnimationFrame(() => {
  if (state.result) drawChart(state.result);
});

recompute();
</script>
